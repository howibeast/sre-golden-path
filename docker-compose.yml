name: golden-path

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: balance
      POSTGRES_DB: balance
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balance -d balance"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging: *logging

  fake-ledger:
    build: ./services/fake-ledger
    environment:
      LEDGER_TOKEN: dev-ledger-token
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 20
    logging: *logging

  account-balance:
    build:
      context: ./services/account-balance
      target: runtime
    environment:
      DATABASE_URL: postgresql://balance:balance@postgres:5432/balance
      LEDGER_URL: http://fake-ledger:8081
      LEDGER_TOKEN: dev-ledger-token
      LEDGER_TIMEOUT_SECONDS: "0.08"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_DISABLED: "0"
      SERVICE_NAME: account-balance
      DEPLOYMENT_ENVIRONMENT: local
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fake-ledger:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./golden-path/telemetry/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "8889:8889"
    depends_on:
      - jaeger
    logging: *logging

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=31d
    volumes:
      - ./golden-path/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./golden-path/slo/generated:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./golden-path/telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./golden-path/telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    logging: *logging

  integration-tests:
    profiles: ["test"]
    build:
      context: ./services/account-balance
      target: test
    environment:
      DATABASE_URL: postgresql://balance:balance@postgres:5432/balance
      OTEL_DISABLED: "1"
    command: ["python", "-m", "pytest", "-q", "-o", "cache_dir=/tmp/pytest_cache", "tests/test_integration.py"]
    volumes:
      - ./services/account-balance/tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  k6:
    profiles: ["load"]
    image: grafana/k6:0.55.0
    environment:
      BASE_URL: http://account-balance:8080
      SCENARIO: steady
    volumes:
      - ./load:/scripts:ro
    command: ["run", "/scripts/balance.js"]
    depends_on:
      account-balance:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
