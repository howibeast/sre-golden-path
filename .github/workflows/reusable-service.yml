name: service-pipeline

on:
  workflow_call:
    inputs:
      service_directory:
        description: Path to the service the gate is evaluating
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall ${{ inputs.service_directory }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r services/account-balance/requirements.txt --progress-spinner off
          pip-audit -r services/fake-ledger/requirements.txt --progress-spinner off

  policy:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Policy gate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python scripts/policy_gate.py

  deploy:
    needs: policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval is the release
        run: echo "The production environment approval is the release gate. This exercise does not push an image or change Azure."
