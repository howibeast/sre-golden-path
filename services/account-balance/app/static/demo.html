<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account balance</title>
  <style>
    :root {
      --navy: #1b365d;
      --gold: #9a8456;
      --ink: #1c2430;
      --muted: #5c6b7a;
      --line: #e6e1d6;
      --paper: #f7f5f1;
      --warn-bg: #fff4e5;
      --warn: #8a4b08;
      --ok: #1d6b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    .logo {
      display: block;
      width: min(100%, 18rem);
      height: auto;
      margin-bottom: 1.75rem;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 1.5rem;
      font-weight: 650;
    }
    .lede {
      margin: 0.35rem 0 1.5rem;
      color: var(--muted);
    }
    form {
      display: grid;
      gap: 0.75rem;
    }
    label {
      grid-column: 1 / -1;
      font-size: 0.85rem;
      color: var(--navy);
      font-weight: 650;
    }
    select, button {
      font: inherit;
      height: 2.75rem;
      border-radius: 0.4rem;
    }
    select {
      width: 100%;
      padding: 0 0.75rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    button {
      width: 100%;
      padding: 0 1rem;
      border: 0;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    .actions, .shots {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    h2 {
      margin: 2rem 0 0.35rem;
      color: var(--navy);
      font-size: 1.15rem;
    }
    .hint { margin: 0 0 0.75rem; color: var(--muted); }
    .links { margin: 0.75rem 0 0; }
    .links a { color: var(--navy); }
    #terminal {
      margin-top: 0.75rem;
      min-height: 9rem;
      max-height: 16rem;
      overflow: auto;
      padding: 0.85rem 1rem;
      background: var(--navy);
      color: #f4efe4;
      border-radius: 0.4rem;
      font: 13px/1.45 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
    }
    @media (min-width: 36rem) {
      form {
        grid-template-columns: 1fr auto;
        align-items: end;
      }
      form button { width: auto; }
      .actions, .shots { grid-template-columns: 1fr 1fr; }
    }
    #result, #error {
      margin-top: 1.25rem;
      padding: 1.25rem;
      background: #fff;
      border: 1px solid var(--line);
      border-top: 3px solid var(--gold);
      border-radius: 0.4rem;
    }
    #banner {
      margin: 0 0 0.75rem;
      font-weight: 650;
    }
    #banner.ok { color: var(--ok); }
    #banner.warn {
      margin: -1.25rem -1.25rem 1rem;
      padding: 0.85rem 1.25rem;
      background: var(--warn-bg);
      color: var(--warn);
    }
    #amount {
      margin: 0;
      color: var(--navy);
      font-size: 2.5rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    #settled, #account-line {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }
    #error { color: var(--warn); border-top-color: var(--warn); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/static/sun-international.png" alt="Sun International">
    <h1>Account balance</h1>
    <p class="lede">What this account can spend right now.</p>
    <form id="read">
      <label for="account">Account</label>
      <select id="account">
        <option value="acc_1001">acc_1001 · R50 hold</option>
        <option value="acc_1002">acc_1002 · nothing pending</option>
        <option value="acc_1003">acc_1003 · unconfirmed deposit</option>
      </select>
      <button type="submit">Read balance</button>
    </form>
    <section id="result" hidden>
      <p id="banner"></p>
      <p id="amount"></p>
      <p id="settled"></p>
      <p id="account-line"></p>
    </section>
    <p id="error" hidden></p>

    <h2>Ledger incident</h2>
    <p class="hint">The buttons do what the drill script does. The log is the script output. Only these actions run.</p>
    <div class="actions">
      <button type="button" id="drill">Run 3 minute drill</button>
      <button type="button" id="reset" class="secondary">Reset ledger</button>
    </div>
    <div class="shots">
      <button type="button" class="secondary" data-mode="error">All calls fail</button>
      <button type="button" class="secondary" data-mode="slow">Ledger goes slow</button>
      <button type="button" class="secondary" data-mode="reject_auth">Reject the token</button>
    </div>
    <pre id="terminal" aria-label="Drill log">Ready. Nothing is running.</pre>
    <p class="links">
      <a href="http://localhost:9090/alerts" target="_blank" rel="noopener">Prometheus alerts</a>
      ·
      <a href="http://localhost:3000/d/balance-read" target="_blank" rel="noopener">Grafana</a>
      ·
      <a href="http://localhost:16686/search?service=account-balance&amp;tags=%7B%22balance.degraded%22%3A%22true%22%7D" target="_blank" rel="noopener">Jaeger</a>
    </p>
  </main>
  <script>
    const warnings = {
      pending_not_applied: "Pending amounts were not applied. This is the settled balance only.",
      ledger_incomplete: "The ledger reply was incomplete. This is the settled balance only."
    };
    const form = document.getElementById("read");
    const button = form.querySelector("button");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    const terminal = document.getElementById("terminal");
    const drillButton = document.getElementById("drill");
    let stopDrill = false;
    let drilling = false;

    function rand(display) {
      return "R" + display;
    }

    function term(line) {
      const current = terminal.textContent;
      if (current === "" || current === "Ready. Nothing is running.") {
        terminal.textContent = line;
      } else {
        terminal.textContent += "\n" + line;
      }
      terminal.scrollTop = terminal.scrollHeight;
    }

    function showBalance(body) {
      const banner = document.getElementById("banner");
      if (body.degraded) {
        banner.className = "warn";
        banner.textContent = warnings[body.warning] || body.warning || "This balance is degraded.";
      } else {
        banner.className = "ok";
        banner.textContent = "Confirmed";
      }
      document.getElementById("amount").textContent = rand(body.available.display);
      document.getElementById("settled").textContent = "Settled " + rand(body.settled.display);
      document.getElementById("account-line").textContent = body.account_id + " · " + body.currency;
      result.hidden = false;
      error.hidden = true;
    }

    async function readAccount(accountId) {
      const started = performance.now();
      const response = await fetch("/accounts/" + encodeURIComponent(accountId) + "/balance");
      const elapsed = performance.now() - started;
      if (!response.ok) {
        throw new Error("The balance read returned " + response.status + ".");
      }
      const body = await response.json();
      showBalance(body);
      return { status: response.status, elapsed, body };
    }

    async function setLedger(mode, errorRate) {
      const response = await fetch("/demo/ledger", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: mode, error_rate: errorRate })
      });
      if (!response.ok) {
        throw new Error("The ledger switch returned " + response.status + ".");
      }
      return response.json();
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      error.hidden = true;
      try {
        await readAccount(document.getElementById("account").value);
      } catch (err) {
        result.hidden = true;
        error.hidden = false;
        error.textContent = err.message || "The balance read failed.";
      } finally {
        button.disabled = false;
      }
    });

    drillButton.addEventListener("click", async () => {
      if (drilling) return;
      drilling = true;
      stopDrill = false;
      drillButton.disabled = true;
      document.getElementById("account").value = "acc_1001";
      terminal.textContent = "";
      term("$ python scripts/demo_fault.py --seconds 180");
      try {
        await setLedger("intermittent", 0.1);
        term("ledger control: intermittent, 10% of calls fail");
        term("Reading acc_1001 for 180 seconds. The ledger alert needs the full three minutes.");
        const deadline = Date.now() + 180000;
        let total = 0;
        let degraded = 0;
        let slow = 0;
        const codes = {};
        while (Date.now() < deadline && !stopDrill) {
          const sample = await readAccount("acc_1001");
          total += 1;
          codes[sample.status] = (codes[sample.status] || 0) + 1;
          if (sample.elapsed > 200) slow += 1;
          if (sample.body.degraded) degraded += 1;
          if (total % 25 === 0) {
            term("n=" + total + " codes=" + JSON.stringify(codes) + " degraded=" + degraded + " slower_than_200ms=" + slow + " last_ms=" + Math.round(sample.elapsed));
          }
          await sleep(100);
        }
        term("---");
        term("requests=" + total + " codes=" + JSON.stringify(codes) + " degraded=" + degraded + " slower_than_200ms=" + slow);
        term("Alert to look for: AccountBalanceReadLedgerConfirmErrorRateHigh");
        term("The customer SLO alerts should stay green.");
        term("Jaeger: service account-balance, tag balance.degraded=true");
      } catch (err) {
        term(err.message || "The drill stopped.");
      } finally {
        drilling = false;
        drillButton.disabled = false;
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      stopDrill = true;
      try {
        await setLedger("ok", 0);
        term("$ python scripts/demo_fault.py --reset");
        term("ledger reset to ok");
        term("The breaker stays open for 30 seconds. The red alert needs about two minutes to go green.");
      } catch (err) {
        term(err.message || "Reset failed.");
      }
    });

    document.querySelectorAll("[data-mode]").forEach((shot) => {
      shot.addEventListener("click", async () => {
        const mode = shot.getAttribute("data-mode");
        document.getElementById("account").value = "acc_1001";
        try {
          await setLedger(mode, 1);
          term("$ ledger mode " + mode);
          await readAccount("acc_1001");
          term("One read of acc_1001 finished. Press Reset ledger when you are done.");
        } catch (err) {
          term(err.message || "The switch failed.");
        }
      });
    });
  </script>
</body>
</html>
